name: KBO standings scraper

on:
  schedule:
    # 00:00 UTC = 09:00 in Korea (Asia/Seoul, UTC+9) — zelfde tijdstip als
    # kbo-schedule-scraper.yml (vroeg in de ochtend lokale tijd, ná afloop
    # van alle wedstrijden van de vorige avond, dus het klassement staat
    # dan al vast).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: pip install requests beautifulsoup4

      - name: Standen scrapen
        run: python kbo_standings_scraper.py

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kbo_standings.json
          git diff --staged --quiet || git commit -m "Update KBO standings"
          git push
